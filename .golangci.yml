version: "2"
linters:
    default: none
    enable:
        - errcheck
        - exhaustive
        - forcetypeassert
        - govet
        - ineffassign
        - revive
        - staticcheck
        - unused
        - whitespace
        #- gocritic
        - exptostd
        - usestdlibvars
        # - gosec
    exclusions:
        generated: lax
        presets:
            - comments
            - common-false-positives
            - legacy
            - std-error-handling
        paths:
            - third_party$
            - builtin$
formatters:
    enable:
        - gofmt
    exclusions:
        generated: lax
        paths:
            - third_party$
            - builtin$
